<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 300px;
        font-family: Arial, sans-serif;
        padding: 10px;
        margin: 0;
      }
      h3 {
        margin-top: 0;
        color: #333;
      }
      .btn {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 8px 12px;
        cursor: pointer;
        border-radius: 4px;
        width: 100%;
        font-size: 14px;
      }
      .btn:hover {
        background-color: #0056b3;
      }
      #result {
        margin-top: 15px;
        padding: 10px;
        border-radius: 4px;
        font-weight: bold;
        display: none;
      }
      .safe {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .phishing {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .reason {
        font-weight: normal;
        font-size: 12px;
        margin-top: 5px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h3>AI Phishing Detector</h3>
    <button id="scanBtn" class="btn">Scan Current Tab</button>

    <div id="result">
      <div id="statusText"></div>
      <div id="reasonText" class="reason"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
